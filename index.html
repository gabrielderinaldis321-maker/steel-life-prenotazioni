<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Steel Life — Prenota o disdici corso</title>
<style>
:root{--bg:#050505;--red:#f01820;--red2:#ff343c;--text:#f4efef;--muted:#bd999b;--line:#4b1719}*{box-sizing:border-box}body{margin:0;padding:22px 14px 38px;background:var(--bg);color:var(--text);font:15px Arial,Helvetica,sans-serif;min-height:100vh}.container{max-width:560px;margin:auto;padding:24px;background:#080606;border:2px solid var(--red);border-radius:8px;box-shadow:0 5px 28px #f0182022}.brand{text-align:center;color:var(--red);font-size:32px;font-weight:900;letter-spacing:3px;text-transform:uppercase}h1{text-align:center;font-size:20px;margin:8px 0}.lead{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.warning{display:none;background:#171008;border:1px solid #936432;color:#edcc9d;border-radius:4px;padding:10px;margin-bottom:14px;font-size:12px;line-height:1.5}.warning.show{display:block}.status{background:#100909;border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:16px;color:#e4c7c8;font-size:12px;line-height:1.5;text-align:center}.status.good{color:#72ec9b;border-color:#245d37}.status.error{color:#ff8d90;border-color:#791e22}.live{font-size:9px;letter-spacing:.8px;color:#66e995;font-weight:bold;display:block;margin-top:4px}.schedule{background:#100909;border:1px solid var(--line);padding:13px;border-radius:5px;margin-bottom:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.title{font-size:13px;color:var(--red2);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.slot{font-size:11px;color:#e8dddd;line-height:1.5;background:#070707;border:1px solid #321012;padding:8px;border-radius:4px}.slot-top{display:flex;justify-content:space-between;gap:6px}.slot b{color:#fff}.count{white-space:nowrap;color:#e3c6c7}.count.full{color:#ff7378;font-weight:bold}.slot small{display:block;color:var(--muted)}.form{display:grid;gap:11px}.group label{display:block;margin-bottom:5px;font-size:13px;font-weight:bold;color:var(--red)}input,select{width:100%;height:42px;border:1px solid #812126;background:#050505;color:var(--text);padding:0 10px;border-radius:4px;font-size:14px;outline:none}input:focus,select:focus{border-color:#ff7075}input::placeholder{color:#946467}select:disabled{color:#896a6d}.buttons{display:flex;gap:9px;margin-top:4px}.btn{flex:1;min-height:43px;border:2px solid var(--red);border-radius:4px;background:var(--red);color:#090303;font-weight:900;font-size:12px;letter-spacing:.7px;cursor:pointer}.btn.cancel{color:var(--red);background:#050505}.btn:disabled{opacity:.45;cursor:wait}.foot{text-align:center;font-size:10px;line-height:1.6;color:#806365;margin:14px 0 0}@media(max-width:480px){body{padding:10px}.container{padding:18px 13px}.grid{grid-template-columns:1fr}.brand{font-size:29px}.buttons{gap:7px}}
</style></head><body><main class="container"><div class="brand">Steel Life</div><h1>🏋️ Prenota o Disdici Corso</h1><p class="lead">Seleziona attività, giorno e orario. Massimo 6 persone per slot.</p>
<div id="warning" class="warning"></div><div id="status" class="status">Collegamento al database della palestra…<span id="live" class="live">● CONNESSIONE…</span></div>
<section class="schedule"><div class="head"><h2 class="title">Stato corsi</h2><span class="title">●</span></div><div id="slots" class="grid"></div></section>
<form id="form" class="form"><div class="group"><label for="nome">Nome</label><input id="nome" autocomplete="given-name" placeholder="Inserisci il nome" required></div><div class="group"><label for="cognome">Cognome</label><input id="cognome" autocomplete="family-name" placeholder="Inserisci il cognome" required></div><div class="group"><label for="attivita">Attività</label><select id="attivita" required><option value="">Seleziona attività</option></select></div><div class="group"><label for="giorno">Giorno</label><select id="giorno" required disabled><option value="">Seleziona prima un'attività</option></select></div><div class="group"><label for="orario">Orario</label><select id="orario" required disabled><option value="">Seleziona prima un giorno</option></select></div><div class="buttons"><button class="btn" id="book" type="submit">PRENOTA</button><button class="btn cancel" id="cancel" type="button">DISDICI</button></div></form>
<p class="foot">Dopo la registrazione si apre WhatsApp con il messaggio al proprietario.<br>Premi <b>Invia</b> per avvisarlo.</p></main>
<script>
// Sostituisci con l'hostname HTTPS stabile del tunnel Cloudflare, senza / finale.
const API_BASE='https://INSERISCI-HOST-API';
const WHATSAPP='393281814024',CAPACITY=6,KEY='steel-life-bookings-via-api';
const SCHEDULE={MMA:{'Lunedì':['18:00 - 19:00','19:00 - 20:00','20:00 - 21:00'],'Mercoledì':['18:00 - 19:00','19:00 - 20:00','20:00 - 21:00'],'Venerdì':['18:00 - 19:00','19:00 - 20:00','20:00 - 21:00']},Boxe:{'Martedì':['18:00 - 19:00'],'Giovedì':['18:00 - 19:00']},Kickboxing:{'Martedì':['19:00 - 20:00'],'Giovedì':['19:00 - 20:00']},BJJ:{'Martedì':['20:00 - 21:00'],'Giovedì':['20:00 - 21:00']}};
const $=id=>document.getElementById(id),activity=$('attivita'),day=$('giorno'),time=$('orario');let counts={},busy=false;
function monday(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function configured(){return API_BASE.startsWith('https://')&&!API_BASE.includes('INSERISCI-')}
function key(a,d,t){return `${a}|${d}|${t}`}
function allSlots(){const r=[];for(const [a,ds] of Object.entries(SCHEDULE))for(const [d,ts] of Object.entries(ds))for(const t of ts)r.push({a,d,t});return r}
function render(){const host=$('slots');host.innerHTML='';for(const s of allSlots()){const n=Number(counts[key(s.a,s.d,s.t)]||0),left=Math.max(0,CAPACITY-n),el=document.createElement('div');el.className='slot';el.innerHTML=`<div class="slot-top"><b>${s.a}</b><span class="count ${left===0?'full':''}">${left===0?'ESAURITO':`${n}/${CAPACITY} prenotati`}</span></div><small>${s.d} · ${s.t} · ${left} ${left===1?'posto':'posti'} disponibili</small>`;host.appendChild(el)}$('live').textContent=configured()?'● CONTEGGIO CONDIVISO':'● API NON CONFIGURATA'}
function say(msg,type=''){const s=$('status');s.firstChild.textContent=msg;s.className='status '+type}
function options(select,placeholder,values){select.innerHTML=`<option value="">${placeholder}</option>`;for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o)}select.disabled=!values.length}
function refreshTimes(){let opts=SCHEDULE[activity.value]?.[day.value]||[];opts=opts.filter(t=>Number(counts[key(activity.value,day.value,t)]||0)<CAPACITY);options(time,day.value?'Seleziona orario':'Seleziona prima un giorno',opts)}
async function request(path,body){const r=await fetch(`${API_BASE}/api/${path}`,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});let x={};try{x=await r.json()}catch{}if(!r.ok){const e=new Error(x.error||(x.reason==='FULL'?'Corso completo.':'Servizio temporaneamente non disponibile.'));e.status=r.status;throw e}return x}
async function load(){if(!configured()){$('warning').textContent='Configura l’URL del tunnel HTTPS nel file: senza il collegamento al PC il conteggio resta disattivato.';$('warning').classList.add('show');render();say('Database/API non ancora collegato. Nessuna prenotazione verrà simulata.','error');return}try{const data=await request(`slots?week_start=${monday()}`);counts=data.counts||{};$('warning').classList.remove('show');render();$('live').textContent='● AGGIORNATO';}catch(e){$('live').textContent='● PC NON RAGGIUNGIBILE';$('warning').textContent='Il server della palestra non risponde. Il computer che ospita il database deve essere acceso e il tunnel attivo.';$('warning').classList.add('show');say(e.message,'error')}}
function busyState(v){busy=v;$('book').disabled=v;$('cancel').disabled=v;$('book').textContent=v?'ATTENDI…':'PRENOTA'}
function goWhatsApp(text){location.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`}
function fallbackBooking(first,last,a,d,t){say('Server non collegato: invia la richiesta su WhatsApp e attendi conferma manuale. Il conteggio online non è stato aggiornato.','error');goWhatsApp(`🏋️ *Richiesta prenotazione - Steel Life*\n⚠️ *Da confermare dal proprietario: database non raggiungibile*\n👤 *Nome:* ${first} ${last}\n🥊 *Attività:* ${a}\n📅 *Giorno:* ${d}\n⏰ *Orario:* ${t}`)}
function fallbackCancellation(first,last,a,d,t){say('Server non collegato: invia la richiesta di disdetta su WhatsApp.','error');goWhatsApp(`Ciao Ciro, chiedo la disdetta della prenotazione per ${a}, ${d}, ${t}. Nome: ${first} ${last}. Conferma per favore la disdetta manualmente.`)}
activity.onchange=()=>{options(day,'Seleziona giorno',Object.keys(SCHEDULE[activity.value]||{}));options(time,'Seleziona prima un giorno',[])};day.onchange=refreshTimes;
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const first=$('nome').value.trim(),last=$('cognome').value.trim(),a=activity.value,d=day.value,t=time.value;if(!configured()){fallbackBooking(first,last,a,d,t);return}busyState(true);say('Verifico e riservo il posto…');try{const result=await request('book',{week_start:monday(),activity:a,day_name:d,time_slot:t,first_name:first,last_name:last});counts[key(a,d,t)]=result.booked;render();say('Posto registrato nel database. Invia il messaggio WhatsApp per avvisare il proprietario.','good');setTimeout(()=>goWhatsApp(`🏋️ *Nuova Prenotazione - Steel Life*\n👤 *Nome:* ${first} ${last}\n🥊 *Attività:* ${a}\n📅 *Giorno:* ${d}\n⏰ *Orario:* ${t}`),500)}catch(err){if(!err.status||err.status>=500)fallbackBooking(first,last,a,d,t);else{say(err.message,'error');await load()}}finally{busyState(false)}};
$('cancel').onclick=async()=>{if(busy)return;const first=$('nome').value.trim(),last=$('cognome').value.trim(),a=activity.value,d=day.value,t=time.value;if(!first||!last||!a||!d||!t){say('Compila nome, cognome, attività, giorno e orario per disdire.','error');return}if(!configured()){fallbackCancellation(first,last,a,d,t);return}busyState(true);say('Verifico la prenotazione…');try{const result=await request('cancel',{week_start:monday(),activity:a,day_name:d,time_slot:t,first_name:first,last_name:last});counts[key(a,d,t)]=result.booked;render();say('Disdetta registrata. Invia il messaggio WhatsApp per avvisare il proprietario.','good');setTimeout(()=>goWhatsApp(`Ciao Ciro, vorrei disdire la mia prenotazione per il corso di ${a} di ${d} alle ${t}. Nome: ${first} ${last}`),500)}catch(err){if(!err.status||err.status>=500)fallbackCancellation(first,last,a,d,t);else{say(err.message,'error');await load()}}finally{busyState(false)}};
for(const a of Object.keys(SCHEDULE)){const o=document.createElement('option');o.value=a;o.textContent=a;activity.appendChild(o)}render();load();setInterval(load,15000);
</script></body></html>
